<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SchoolSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #1e40af 100%);
            position: relative;
            overflow: hidden;
        }

        .login-bg-circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            animation: float 6s ease-in-out infinite alternate;
        }
        .login-bg-circle:nth-child(1) { width: 300px; height: 300px; top: -80px; left: -60px; animation-delay: 0s; }
        .login-bg-circle:nth-child(2) { width: 200px; height: 200px; bottom: -50px; right: -40px; animation-delay: 2s; }
        .login-bg-circle:nth-child(3) { width: 150px; height: 150px; top: 40%; right: 10%; animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(10deg); }
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
            animation: cardIn 0.5s ease;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-logo svg { display: inline-block; }

        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #1e3a5f;
            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 16px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .login-divider {
            height: 1px;
            background: #E2E8F0;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            font-size: 14px;
            pointer-events: none;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 14px;
            color: #1E293B;
            background: #F8FAFC;
            transition: all 0.2s;
            font-family: inherit;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
            background: white;
        }
        .input-wrapper input::placeholder { color: #94A3B8; }

        .toggle-pw-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            transition: color 0.2s;
        }
        .toggle-pw-btn:hover { color: #64748B; }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(37,99,235,0.35);
            margin-top: 4px;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.45);
        }
        .login-btn:active { transform: translateY(0); }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #64748B;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: #2563EB; }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #94A3B8;
        }

        .alerts { margin-bottom: 20px; }
        .alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .alert-danger { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }
        .alert-warning { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
        .alert-info { background: #F0F9FF; color: #155E75; border: 1px solid #BAE6FD; }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            .login-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-bg-circle"></div>
    <div class="login-bg-circle"></div>
    <div class="login-bg-circle"></div>

    <div class="login-card">
        <div class="login-logo">
            <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="#2563EB"/>
                <path d="M16 4L4 10v2h24v-2L16 4z" fill="white"/>
                <rect x="6" y="14" width="4" height="10" fill="white"/>
                <rect x="14" y="14" width="4" height="10" fill="white"/>
                <rect x="22" y="14" width="4" height="10" fill="white"/>
                <rect x="4" y="24" width="24" height="2" fill="white"/>
                <rect x="13" y="10" width="6" height="4" fill="#93C5FD"/>
            </svg>
        </div>
        <h1 class="login-title">SchoolSync</h1>
        <p class="login-subtitle">Welcome Back</p>
        <div class="login-divider"></div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="alerts">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'danger' %}exclamation-circle{% elif category == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword()">
                        <i class="fas fa-eye" id="pwToggleIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <a href="{{ url_for('auth.forgot_password') }}" class="forgot-link">Forgot Password?</a>

        <div class="login-footer">&copy; 2025 SchoolSync</div>
    </div>

    <script>
        function togglePassword() {
            var field = document.getElementById('password');
            var icon = document.getElementById('pwToggleIcon');
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
